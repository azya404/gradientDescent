<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainrot Interviewer — Backend Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: #0a0a0a;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { color: #ef4444; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #71717a; font-size: 0.75rem; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 2px; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; }
    label { color: #a1a1aa; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem; display: block; }
    select, textarea {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      color: #e4e4e7;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, textarea:focus { border-color: #ef4444; }
    textarea { min-height: 200px; resize: vertical; }
    select { width: auto; min-width: 150px; cursor: pointer; }
    .row { display: flex; gap: 1rem; align-items: center; }
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-record { background: #27272a; color: #ef4444; border: 1px solid #ef4444; }
    .btn-record:hover { background: #1c1c1e; }
    .btn-record.recording { background: #ef4444; color: white; animation: pulse 1s infinite; }
    .btn-submit { background: #ef4444; color: white; }
    .btn-submit:hover { background: #dc2626; }
    .btn-submit:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
    .status-bar {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.8rem;
      color: #71717a;
      min-height: 60px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-bar.error { border-color: #ef4444; color: #fca5a5; }
    .status-bar.success { border-color: #22c55e; color: #86efac; }
    .audio-section { display: flex; flex-direction: column; gap: 0.5rem; }
    audio { width: 100%; border-radius: 8px; }
    .roast-text {
      background: #18181b;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 1rem;
      font-size: 1rem;
      color: #fca5a5;
      font-style: italic;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #27272a;
      color: #a1a1aa;
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>🔥 Brainrot Interviewer</h1>
  <p class="subtitle">Backend End-to-End Test</p>

  <div class="container">
    <!-- Language + Code -->
    <div>
      <div class="row" style="margin-bottom: 0.5rem;">
        <label style="margin:0;">Your Code</label>
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
          <option value="typescript">TypeScript</option>
          <option value="go">Go</option>
        </select>
      </div>
      <textarea id="code" placeholder="Paste your mid code here...">def sort(arr):
  for i in range(len(arr)):
    for j in range(len(arr)):
      if arr[i] < arr[j]:
        arr[i], arr[j] = arr[j], arr[i]
  return arr</textarea>
    </div>

    <!-- Audio Recording -->
    <div>
      <label>Voice Explanation <span class="badge">optional</span></label>
      <div class="row">
        <button id="recordBtn" class="btn btn-record" onclick="toggleRecording()">🎤 Hold to Record</button>
        <span id="recordStatus" style="color:#71717a; font-size:0.8rem;">No audio recorded</span>
      </div>
    </div>

    <!-- Submit -->
    <button id="submitBtn" class="btn btn-submit" onclick="submitRoast()">SUBMIT FOR REVIEW</button>

    <!-- Status -->
    <div>
      <label>Status</label>
      <div id="status" class="status-bar">Ready. Paste code and hit submit.</div>
    </div>

    <!-- Roast Result -->
    <div id="resultSection" style="display:none;">
      <label>The Roast 🎤</label>
      <div id="roastText" class="roast-text"></div>
      <div class="audio-section" style="margin-top:0.75rem;">
        <label>Listen</label>
        <audio id="roastAudio" controls></audio>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBlob = null;
    let isRecording = false;

    // --- Recording ---
    async function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
          document.getElementById('recordStatus').textContent = 
            `✅ Recorded ${(recordedBlob.size / 1024).toFixed(1)}KB (${mediaRecorder.mimeType})`;
          // Stop all tracks so the mic indicator goes away
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordBtn').classList.add('recording');
        document.getElementById('recordBtn').textContent = '⏹ Stop Recording';
        document.getElementById('recordStatus').textContent = '🔴 Recording...';
      } catch (err) {
        setStatus(`Mic error: ${err.message}`, 'error');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      document.getElementById('recordBtn').classList.remove('recording');
      document.getElementById('recordBtn').textContent = '🎤 Record Again';
    }

    // --- Submit ---
    async function submitRoast() {
      const code = document.getElementById('code').value.trim();
      const language = document.getElementById('language').value;

      if (!code) {
        setStatus('No code? Too scared to even try?', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'ROASTING...';
      document.getElementById('resultSection').style.display = 'none';
      setStatus('⏳ Sending to backend... (Gemini → ElevenLabs → MP3)');

      const formData = new FormData();
      formData.append('language', language);
      formData.append('code', code);

      if (recordedBlob) {
        // Determine file extension from mime type
        const ext = recordedBlob.type.includes('webm') ? '.webm' 
                  : recordedBlob.type.includes('mp4') ? '.mp4' 
                  : recordedBlob.type.includes('ogg') ? '.ogg' 
                  : '.wav';
        formData.append('audio', recordedBlob, `explanation${ext}`);
        setStatus('⏳ Sending code + audio to backend...');
      }

      try {
        const startTime = Date.now();
        const res = await fetch('/api/roast', { method: 'POST', body: formData });
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

        if (!res.ok) {
          const err = await res.json();
          setStatus(`❌ Error ${res.status}: ${err.details || err.error}`, 'error');
          return;
        }

        // Get roast text from header
        const roastText = decodeURIComponent(res.headers.get('X-Roast-Text') || '');
        
        // Get audio blob
        const audioBlob = await res.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        // Display results
        document.getElementById('roastText').textContent = roastText || '(roast text not in headers)';
        const audioEl = document.getElementById('roastAudio');
        audioEl.src = audioUrl;
        document.getElementById('resultSection').style.display = 'block';

        setStatus(`✅ Done in ${elapsed}s — ${(audioBlob.size / 1024).toFixed(0)}KB MP3`, 'success');

        // Auto-play
        audioEl.play().catch(() => {});
      } catch (err) {
        setStatus(`❌ Network error: ${err.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT FOR REVIEW';
      }
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status-bar' + (type ? ` ${type}` : '');
    }
  </script>
</body>
</html>
